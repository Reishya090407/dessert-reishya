<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MINI BITES - Dessert Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MINI BITES</div>
        <div class="menu-links">Beranda &nbsp; Menu &nbsp; Kontak</div>
        <div class="cart-icon" onclick="tampilkanKeranjang()">🛒 Keranjang (<span id="cart-count">0</span>)</div>
    </nav>

    <section class="hero">
        <h1>Our Sweet Menu</h1>
        <input type="text" id="search-input" onkeyup="cariProduk()" placeholder="cari dessert favoritmu...">
        <div class="category-filter">
            <button onclick="filterMenu('semua')">Semua</button>
            <button onclick="filterMenu('kue')">Kue & Cake</button>
            <button onclick="filterMenu('puding')">Puding</button>
        </div>
    </section>

    <div class="product-grid">
        <div class="product-card kue">
            <div class="img-box"></div>
            <h3>Kue Cokelat Lumer</h3>
            <p>Kue cokelat premium dengan isian lumer.</p>
            <button onclick="tambahKeKeranjang('Kue Cokelat Lumer', 25000)">+ Keranjang</button>
        </div>
        <div class="product-card puding">
            <div class="img-box"></div>
            <h3>Puding Mangga</h3>
            <p>Puding mangga segar dan lembut.</p>
            <button onclick="tambahKeKeranjang('Puding Mangga', 15000)">+ Keranjang</button>
        </div>
    </div>

    <!-- Modal Keranjang -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span onclick="tutupKeranjang()" style="cursor:pointer;">&times;</span>
            <h3>Keranjang Anda</h3>
            <div id="cart-items-list"></div>
            <button onclick="checkoutWhatsApp()">Checkout via WA</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
